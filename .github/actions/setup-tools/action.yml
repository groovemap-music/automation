name: Set up pinned repository tools
description: Install the caller repository's mise toolchain with shared caching.

runs:
  using: composite
  steps:
    - name: Install pinned tools
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install: true
        cache: true
